<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instances</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ERROR" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body class="instance-body">
    
    <div id="bg-layer" class="bg-layer"></div>

    <div class="instance-layout">
        <nav class="side-dock">
            <div class="dock-top">
                <span id="back-to-dash" class="material-icons menu-btn" title="Volver al menú">menu</span>
            </div>

            <div id="dock-icons" class="dock-icons">
            </div>

            <div class="dock-bottom">
                <img id="user-avatar-dock" class="dock-avatar" src="" alt="Skin">
            </div>
        </nav>

        <main class="main-stage">
            <div class="bottom-area">
                
                <div id="play-container" class="play-btn-container">
                    <button id="play-btn" class="btn-play">DESCARGAR</button>
                </div>

                <div id="progress-ui" class="download-panel hidden">
                    <div class="dp-left">
                        <h2 id="dp-title">Cargando...</h2>
                        
                        <div class="dp-bar-container">
                            <div id="dp-bar-1" class="dp-bar-fill"></div>
                        </div>
                        
                        <div id="status-text" class="dp-status-text">Iniciando...</div>
                        
                        <div class="dp-bar-container">
                            <div id="dp-bar-2" class="dp-bar-fill"></div>
                        </div>
                        
                        <div id="dp-timer" class="dp-timer">00:00</div>
                    </div>
                    
                    <div class="dp-right">
                        <img id="dp-image" src="" alt="Cover de la instancia">
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="instance.js"></script>
</body>
</html>
