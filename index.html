<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eufonia Client - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="background-graphic"></div>
    
    <div class="login-container">
        <h1>PLEASE <span class="highlight">LOG-IN</span></h1>
        <h2>WITH YOUR ACCOUNT</h2>

        <div id="initial-view" class="view-section">
            <button id="show-login-btn" class="red-btn">
                <span class="icon">⊞</span> Iniciar Sesión
            </button>
        </div>

        <div id="form-view" class="view-section hidden-smooth">
            <input type="text" id="username-input" placeholder="Nombre de usuario" autocomplete="off">
            <input type="password" id="password-input" placeholder="Contraseña">
            <button id="submit-login-btn" class="red-btn btn-small">Acceder</button>
        </div>

        <div class="language-selector">
            <label>Language</label>
            <select>
                <option>English</option>
                <option>Español</option>
            </select>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
