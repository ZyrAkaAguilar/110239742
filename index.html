<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyrAkaTV™ App | Gestor de Instancias, Eventos & Seguridad</title>
    <meta name="description" content="Portal oficial de acceso, instancias de juego, historial disciplinario y gestión de eventos para ZyrIsland y ZyrAkaTV™.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#cc1224">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/png" href="https://zyrisland.net/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="https://zyrisland.net/favicon/favicon.ico" />
</head>
<body>
    <div class="ambient-canvas"></div>
    <div class="ambient-grid"></div>

    <!-- Contenedor de Notificaciones Toast -->
    <div id="toast-stack" class="toast-stack"></div>

    <!-- Raíz Dinámica de la Aplicación -->
    <div id="app-root"></div>

    <!-- Modal de Instalación / Descarga de Instancia -->
    <div id="install-modal-backdrop" class="modal-backdrop">
        <div class="install-modal">
            <h3 id="modal-inst-title">Preparando Instancia...</h3>
            <p id="modal-inst-desc">Verificando integridad de archivos y credenciales de sesión.</p>
            <div class="install-bar-bg">
                <div id="modal-progress-fill" class="install-bar-fill"></div>
            </div>
            <div id="modal-step-text" class="install-step-label">Inicializando cliente...</div>
            <div class="modal-footer-btns">
                <button type="button" id="modal-close-btn" class="btn-ban-logout" style="padding: 10px 18px;">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           ESTADO GLOBAL Y UTILIDADES DE COOKIES / STORAGE
           ========================================================= */
        const STORAGE_SANDBOX_KEY = "zyrisland_staff_sandbox_accounts";
        let baseAccounts = [];
        let instancesList = [];
        let currentUser = null;
        let activeTab = "instancias"; // "instancias" | "historial" | "staff"
        let countdownInterval = null;
        let lastRenderHash = "";

        function setCookie(name, value, days = 7) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function showToast(title, message, type = "error") {
            const stack = document.getElementById("toast-stack");
            const toast = document.createElement("div");
            toast.className = `toast-item ${type}`;

            const iconClass = type === "success"
                ? "fa-check-circle"
                : type === "warn"
                    ? "fa-exclamation-triangle"
                    : "fa-shield-alt";

            toast.innerHTML = `
                <i class="fas ${iconClass} toast-icon"></i>
                <div class="toast-body">
                    <h4>${title}</h4>
                    <p>${message}</p>
                </div>
                <div class="toast-progress"></div>
            `;

            stack.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(30px)";
                toast.style.transition = "all 0.3s ease";
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        function getAvatarUrl(username, size = 64) {
            const clean = encodeURIComponent((username || "Steve").trim() || "Steve");
            return `https://mc-heads.net/avatar/${clean}/${size}`;
        }

        function getBodyUrl(username) {
            const clean = encodeURIComponent((username || "Steve").trim() || "Steve");
            return `https://mc-heads.net/body/${clean}/right`;
        }

        /* =========================================================
           CARGA Y SINCRONIZACIÓN DE JSON + SANDBOX STAFF
           ========================================================= */
        function getMergedAccounts() {
            const sandboxRaw = localStorage.getItem(STORAGE_SANDBOX_KEY);
            if (!sandboxRaw) return baseAccounts;
            try {
                const sandboxMap = JSON.parse(sandboxRaw);
                return baseAccounts.map(acc => sandboxMap[acc.username.toLowerCase()] || acc);
            } catch (_) {
                return baseAccounts;
            }
        }

        function saveAccountOverride(updatedAccount) {
            let sandboxMap = {};
            try {
                sandboxMap = JSON.parse(localStorage.getItem(STORAGE_SANDBOX_KEY) || "{}");
            } catch (_) {}
            sandboxMap[updatedAccount.username.toLowerCase()] = updatedAccount;
            localStorage.setItem(STORAGE_SANDBOX_KEY, JSON.stringify(sandboxMap));
        }

        function resetSandboxOverrides() {
            localStorage.removeItem(STORAGE_SANDBOX_KEY);
        }

        async function fetchEcosystemData() {
            try {
                const [accRes, instRes] = await Promise.all([
                    fetch(`accounts.json?t=${Date.now()}`, { cache: "no-store" }),
                    fetch(`instances.json?t=${Date.now()}`, { cache: "no-store" })
                ]);

                if (accRes.ok) baseAccounts = await accRes.json();
                if (instRes.ok) instancesList = await instRes.json();
            } catch (err) {
                console.warn("Sincronizando con caché local:", err);
            }

            const isLoggedIn = getCookie("Esta_iniciado_sesion") === "true";
            const savedName = getCookie("Nombre");

            if (isLoggedIn && savedName) {
                const merged = getMergedAccounts();
                const found = merged.find(u => u.username.toLowerCase() === savedName.toLowerCase());
                if (found) {
                    currentUser = found;
                    renderAuthenticatedExperience();
                    return;
                }
            }

            currentUser = null;
            renderLoginScreen();
        }

        /* =========================================================
           VISTA 1: PANTALLA DE INICIO DE SESIÓN
           ========================================================= */
        function renderLoginScreen() {
            const hash = "LOGIN_VIEW";
            if (lastRenderHash === hash) return;
            lastRenderHash = hash;
            clearInterval(countdownInterval);

            const root = document.getElementById("app-root");
            root.innerHTML = `
                <main class="login-view">
                    <section class="login-card" id="login-card">
                        <div class="login-brand">
                            <div class="login-logo-ring">
                                <img src="https://app.zyrisland.net/assets/icons/zyrakatv-ico.png" alt="ZyrAkaTV Logo">
                            </div>
                            <h1>ZYRAKA<span style="color: var(--accent-red);">TV™</span> APP</h1>
                            <p>Acceso oficial a instancias, eventos y seguridad de ZyrIsland</p>
                        </div>

                        <form id="login-form" autocomplete="off">
                            <div class="form-group">
                                <label for="login-username">Usuario de Minecraft (IGN)</label>
                                <div class="input-wrapper">
                                    <input type="text" id="login-username" placeholder="Ej. ZyrAkaAguilar" required>
                                    <i class="fas fa-user field-icon"></i>
                                </div>
                            </div>

                            <div class="skin-preview-strip">
                                <img id="login-skin-img" src="${getAvatarUrl("ZyrAkaAguilar", 64)}" alt="Avatar Preview">
                                <span>Vista previa de identidad: <strong id="login-skin-name">Invitado</strong></span>
                            </div>

                            <div class="form-group">
                                <label for="login-password">Clave de Acceso</label>
                                <div class="input-wrapper">
                                    <input type="password" id="login-password" placeholder="Ingresa tu clave asignada" required>
                                    <i class="fas fa-lock field-icon"></i>
                                    <button type="button" id="toggle-pass" class="toggle-pass-btn" aria-label="Mostrar contraseña">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn-login-submit">
                                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                            </button>
                        </form>

                        <div class="quick-demo-box">
                            <div class="quick-demo-title">Accesos Rápidos de Prueba</div>
                            <div class="demo-pills">
                                <button type="button" class="demo-pill-btn" data-user="ZyrAkaAguilar" data-pass="zyr2026">👑 Admin / Staff</button>
                                <button type="button" class="demo-pill-btn" data-user="PlayerTest" data-pass="1234">⚠️ Con Warns (2/3)</button>
                                <button type="button" class="demo-pill-btn" data-user="UserSancionado" data-pass="1234">🚫 Baneado</button>
                                <button type="button" class="demo-pill-btn" data-user="InvitadoPendiente" data-pass="1234">🔒 Sin Whitelist</button>
                            </div>
                        </div>
                    </section>
                </main>
            `;

            const userInput = document.getElementById("login-username");
            const passInput = document.getElementById("login-password");
            const skinImg = document.getElementById("login-skin-img");
            const skinName = document.getElementById("login-skin-name");

            userInput.addEventListener("input", () => {
                const val = userInput.value.trim();
                skinName.textContent = val || "Invitado";
                skinImg.src = getAvatarUrl(val || "Steve", 64);
            });

            document.getElementById("toggle-pass").addEventListener("click", function () {
                const isPass = passInput.type === "password";
                passInput.type = isPass ? "text" : "password";
                this.innerHTML = `<i class="fas ${isPass ? "fa-eye-slash" : "fa-eye"}"></i>`;
            });

            document.querySelectorAll(".demo-pill-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    userInput.value = btn.dataset.user;
                    passInput.value = btn.dataset.pass;
                    userInput.dispatchEvent(new Event("input"));
                    document.getElementById("login-form").dispatchEvent(new Event("submit"));
                });
            });

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const ign = userInput.value.trim();
                const pwd = passInput.value;
                const merged = getMergedAccounts();
                const matched = merged.find(u => u.username.toLowerCase() === ign.toLowerCase() && u.password === pwd);

                if (!matched) {
                    const card = document.getElementById("login-card");
                    card.classList.remove("shake");
                    void card.offsetWidth;
                    card.classList.add("shake");
                    showToast("Credenciales Incorrectas", "El usuario IGN o la clave ingresada no coinciden con nuestros registros.", "error");
                    return;
                }

                setCookie("Esta_iniciado_sesion", "true", 7);
                setCookie("Nombre", matched.username, 7);
                currentUser = matched;
                activeTab = "instancias";
                showToast("Sesión Iniciada", `Bienvenido de vuelta, ${matched.username}.`, "success");
                renderAuthenticatedExperience();
            });
        }

        function handleLogout() {
            deleteCookie("Esta_iniciado_sesion");
            deleteCookie("Nombre");
            currentUser = null;
            lastRenderHash = "";
            clearInterval(countdownInterval);
            showToast("Sesión Cerrada", "Has salido de forma segura del portal.", "warn");
            renderLoginScreen();
        }

        /* =========================================================
           ENRUTADOR DE EXPERIENCIA AUTENTICADA (BAN / NO-AUTH / APP)
           ========================================================= */
        function renderAuthenticatedExperience() {
            if (!currentUser) return renderLoginScreen();

            // 1. Verificar si la cuenta tiene un baneo activo
            if (currentUser.baneo && currentUser.baneo.activo === true) {
                renderBanScreen(currentUser);
                return;
            }

            // 2. Verificar si el usuario tiene autorización en whitelist
            if (currentUser.autorizado !== true) {
                renderUnauthorizedScreen(currentUser);
                return;
            }

            // 3. Renderizar Dashboard Principal
            renderMainDashboard(currentUser);
        }

        /* =========================================================
           VISTA 2: PANTALLA DE BLOQUEO POR BANEO (TEMP-BAN / PERM-BAN)
           ========================================================= */
        function renderBanScreen(user) {
            const hash = `BAN_${JSON.stringify(user.baneo)}`;
            if (lastRenderHash === hash) return;
            lastRenderHash = hash;
            clearInterval(countdownInterval);

            const ban = user.baneo;
            const isPerm = ban.tipo === "permban";
            const root = document.getElementById("app-root");

            root.innerHTML = `
                <main class="ban-screen-overlay">
                    <section class="ban-card">
                        <div class="ban-shield-icon">
                            <i class="fas ${isPerm ? "fa-ban" : "fa-hourglass-half"}"></i>
                        </div>
                        <div class="ban-type-pill">
                            <i class="fas fa-exclamation-circle"></i>
                            <span>${isPerm ? "EXPULSIÓN PERMANENTE (PERM-BAN)" : "SUSPENSIÓN TEMPORAL (TEMP-BAN)"}</span>
                        </div>
                        <h1>ACCESO RESTRINGIDO</h1>
                        <p style="color: var(--text-muted); margin: 0;">
                            La cuenta <strong style="color: #fff;">${user.username}</strong> tiene una sanción disciplinaria vigente en la red <strong>ZyrIsland</strong>.
                        </p>

                        <div class="ban-reason-box">
                            <span>Motivo registrado por administración</span>
                            <p>${ban.razon || "Incumplimiento grave de los Términos y Condiciones de ZyrIsland."}</p>
                        </div>

                        <div class="ban-meta-grid">
                            <div class="ban-meta-cell">
                                <small>ID de Caso</small>
                                <strong>${ban.id_caso || "BAN-2026-000"}</strong>
                            </div>
                            <div class="ban-meta-cell">
                                <small>Aplicado por</small>
                                <strong>${ban.staff || "Administración"}</strong>
                            </div>
                            <div class="ban-meta-cell">
                                <small>Fecha de Sanción</small>
                                <strong>${ban.fecha || "Reciente"}</strong>
                            </div>
                        </div>

                        ${!isPerm && ban.expira ? `
                            <div class="countdown-box">
                                <small>Tiempo restante para levantamiento automático</small>
                                <div class="countdown-timer" id="ban-countdown">Calculando...</div>
                            </div>
                        ` : `
                            <div class="countdown-box">
                                <small>Duración de la medida</small>
                                <div class="countdown-timer" style="font-size: 1.15rem; color: #ff6b7a;">PERMANENTE E IRREVOCABLE</div>
                            </div>
                        `}

                        <div class="ban-actions-row">
                            ${ban.apelable !== false ? `
                                <a href="https://discord.gg/DVBdqXgsGu" target="_blank" rel="noopener" class="btn-appeal-discord">
                                    <i class="fab fa-discord"></i> Abrir Ticket de Apelación
                                </a>
                            ` : ""}
                            <button type="button" id="ban-logout-btn" class="btn-ban-logout">
                                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                            </button>
                        </div>
                    </section>
                </main>
            `;

            document.getElementById("ban-logout-btn").addEventListener("click", handleLogout);

            if (!isPerm && ban.expira) {
                const targetTime = new Date(ban.expira).getTime();
                const updateTimer = () => {
                    const el = document.getElementById("ban-countdown");
                    if (!el) return;
                    const diff = targetTime - Date.now();
                    if (diff <= 0) {
                        el.textContent = "SUSPENSIÓN FINALIZADA — RECARGA";
                        clearInterval(countdownInterval);
                        return;
                    }
                    const d = Math.floor(diff / 86400000);
                    const h = Math.floor((diff % 86400000) / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    el.textContent = `${d}d ${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
                };
                updateTimer();
                countdownInterval = setInterval(updateTimer, 1000);
            }
        }

        /* =========================================================
           VISTA 3: PANTALLA NO AUTORIZADO (SIN WHITELIST)
           ========================================================= */
        function renderUnauthorizedScreen(user) {
            const hash = `NOAUTH_${user.username}`;
            if (lastRenderHash === hash) return;
            lastRenderHash = hash;
            clearInterval(countdownInterval);

            const root = document.getElementById("app-root");
            root.innerHTML = `
                <main class="ban-screen-overlay" style="background: radial-gradient(circle at 50% 25%, rgba(245, 158, 11, 0.16) 0%, #09090d 55%, #070707 100%);">
                    <section class="ban-card" style="border-color: rgba(245, 158, 11, 0.4); border-top-color: var(--accent-amber);">
                        <div class="ban-shield-icon" style="color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.45); background: rgba(245, 158, 11, 0.12);">
                            <i class="fas fa-user-lock"></i>
                        </div>
                        <div class="ban-type-pill" style="color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); background: rgba(245, 158, 11, 0.14);">
                            <span>CUENTA PENDIENTE DE WHITELIST</span>
                        </div>
                        <h1>NO AUTORIZADO</h1>
                        <p style="color: var(--text-muted); line-height: 1.65; margin: 14px 0 28px 0;">
                            Hola <strong style="color: #fff;">${user.username}</strong>, tu perfil aún no cuenta con permisos activos para descargar modpacks o ingresar a las instancias privadas de <strong>ZyrIsland</strong>.
                        </p>
                        <div class="ban-actions-row">
                            <a href="https://discord.gg/DVBdqXgsGu" target="_blank" rel="noopener" class="btn-appeal-discord">
                                <i class="fab fa-discord"></i> Solicitar Acceso en Discord
                            </a>
                            <button type="button" id="noauth-logout-btn" class="btn-ban-logout">
                                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                            </button>
                        </div>
                    </section>
                </main>
            `;

            document.getElementById("noauth-logout-btn").addEventListener("click", handleLogout);
        }

        /* =========================================================
           VISTA 4: DASHBOARD PRINCIPAL CON TABS Y GESTIÓN DISCIPLINARIA
           ========================================================= */
        function renderMainDashboard(user) {
            const activeWarns = (user.warns || []).filter(w => w.activa !== false);
            const maxWarns = user.max_warns || 3;
            const isStaff = user.role === "admin" || user.role === "staff";

            const hash = `DASH_${activeTab}_${JSON.stringify(user)}_${JSON.stringify(instancesList)}`;
            if (lastRenderHash === hash) return;
            lastRenderHash = hash;
            clearInterval(countdownInterval);

            const strikeLevel = Math.min(3, activeWarns.length);
            const riskLabel = strikeLevel === 0
                ? "Historial limpio • Sin advertencias"
                : strikeLevel === 1
                    ? "Precaución • 1 advertencia acumulada"
                    : strikeLevel === 2
                        ? "Riesgo alto • A 1 warn de suspensión"
                        : "Límite alcanzado • Revisión disciplinaria";

            const root = document.getElementById("app-root");
            root.innerHTML = `
                <div class="app-shell">
                    <header class="topbar">
                        <a href="https://zyrisland.net" class="topbar-brand">
                            <img src="https://app.zyrisland.net/assets/icons/zyrakatv-ico.png" alt="ZyrAkaTV">
                            <div class="topbar-brand-text">
                                <strong>ZYRAKA™</strong>
                                <span>LAUNCHER & APP</span>
                            </div>
                        </a>

                        <nav class="topbar-nav">
                            <button type="button" class="tab-btn ${activeTab === "instancias" ? "active" : ""}" data-tab="instancias">
                                <i class="fas fa-cubes"></i> Instancias
                            </button>
                            <button type="button" class="tab-btn ${activeTab === "historial" ? "active" : ""}" data-tab="historial">
                                <i class="fas fa-exclamation-triangle"></i> Warns & Estado
                                <span class="tab-badge-count">${activeWarns.length}/${maxWarns}</span>
                            </button>
                            ${isStaff ? `
                                <button type="button" class="tab-btn ${activeTab === "staff" ? "active" : ""}" data-tab="staff">
                                    <i class="fas fa-gavel"></i> Panel Staff
                                </button>
                            ` : ""}
                        </nav>

                        <div class="topbar-user">
                            <div class="user-chip">
                                <img src="${getAvatarUrl(user.username, 64)}" alt="${user.username}">
                                <div class="user-chip-info">
                                    <strong>${user.username}</strong>
                                    <span>${user.badge || user.role.toUpperCase()}</span>
                                </div>
                            </div>
                            <button type="button" id="topbar-logout-btn" class="btn-logout" title="Cerrar Sesión">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </header>

                    <main class="dashboard-main">
                        <!-- Banner de Perfil + Medidor Visual de Warns -->
                        <section class="hero-profile-banner">
                            <div class="hero-profile-left">
                                <div class="skin-render-box">
                                    <img src="${getBodyUrl(user.username)}" alt="Skin ${user.username}">
                                </div>
                                <div class="hero-text-area">
                                    <div class="role-pill">
                                        <i class="fas fa-shield-alt"></i>
                                        <span>${user.badge || "MIEMBRO AUTORIZADO"}</span>
                                    </div>
                                    <h1>Hola, <span style="color: var(--accent-red);">${user.username}</span></h1>
                                    <p>Discord vinculado: <strong style="color: #fff;">${user.discord || "No especificado"}</strong> • Sesión protegida en tiempo real.</p>
                                </div>
                            </div>

                            <div class="discipline-widget" id="jump-to-warns" title="Haz clic para ver el detalle de tus advertencias">
                                <div class="discipline-widget-top">
                                    <span>Estado Disciplinario</span>
                                    <strong style="color: ${strikeLevel >= 2 ? "#ff5c6c" : strikeLevel === 1 ? "#fbbf24" : "#34d399"};">
                                        ${activeWarns.length} / ${maxWarns} WARNS
                                    </strong>
                                </div>
                                <div class="strike-segments">
                                    <div class="strike-bar ${strikeLevel >= 1 ? `filled-${strikeLevel}` : ""}"></div>
                                    <div class="strike-bar ${strikeLevel >= 2 ? `filled-${strikeLevel}` : ""}"></div>
                                    <div class="strike-bar ${strikeLevel >= 3 ? `filled-${strikeLevel}` : ""}"></div>
                                </div>
                                <div class="discipline-widget-sub">${riskLabel}</div>
                            </div>
                        </section>

                        <!-- Contenedor Dinámico de Pestaña -->
                        <div id="tab-content-area"></div>
                    </main>
                </div>
            `;

            document.getElementById("topbar-logout-btn").addEventListener("click", handleLogout);
            document.getElementById("jump-to-warns").addEventListener("click", () => {
                activeTab = "historial";
                lastRenderHash = "";
                renderMainDashboard(currentUser);
            });

            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    activeTab = btn.dataset.tab;
                    lastRenderHash = "";
                    renderMainDashboard(currentUser);
                });
            });

            const tabArea = document.getElementById("tab-content-area");
            if (activeTab === "instancias") {
                renderInstancesTab(tabArea, user);
            } else if (activeTab === "historial") {
                renderWarningsTab(tabArea, user);
            } else if (activeTab === "staff" && isStaff) {
                renderStaffModerationTab(tabArea, user);
            }
        }

        /* =========================================================
           TAB A: INSTANCIAS Y MODPACKS AUTORIZADOS
           ========================================================= */
        function renderInstancesTab(container, user) {
            const allowedIds = Array.isArray(user.instancias_permitidas) ? user.instancias_permitidas : [];
            const visibleInstances = instancesList.filter(inst => allowedIds.includes(inst.id));

            container.innerHTML = `
                <div class="section-header-row">
                    <h2><i class="fas fa-server"></i> Tus Instancias Autorizadas (${visibleInstances.length})</h2>
                    <div class="sync-indicator">
                        <span class="sync-dot"></span>
                        <span>Sincronización activa cada 4s</span>
                    </div>
                </div>

                ${visibleInstances.length === 0 ? `
                    <div class="clean-record-box" style="border-top-color: var(--accent-red);">
                        <i class="fas fa-box-open" style="color: var(--accent-red);"></i>
                        <h3>Sin instancias asignadas</h3>
                        <p>Tu cuenta está verificada, pero aún no tiene paquetes de servidor vinculados. Consulta con el equipo Staff en Discord.</p>
                    </div>
                ` : `
                    <div class="instances-grid">
                        ${visibleInstances.map(inst => `
                            <article class="instance-card">
                                <div>
                                    <div class="instance-card-top">
                                        <span class="instance-tag">${inst.tag || "INSTANCIA"}</span>
                                        <span class="instance-status ${inst.estado === "online" ? "online" : "maintenance"}">
                                            <i class="fas fa-circle" style="font-size: 0.55rem;"></i>
                                            ${inst.estado === "online" ? "Disponible" : "En Pruebas"}
                                        </span>
                                    </div>
                                    <h3>${inst.nombre}</h3>
                                    <p>${inst.descripcion}</p>
                                    <div class="instance-meta-row">
                                        <span class="meta-chip"><i class="fas fa-code-branch"></i> ${inst.version}</span>
                                        <span class="meta-chip"><i class="fas fa-cubes"></i> ${inst.mods_count} mods</span>
                                        <span class="meta-chip"><i class="fas fa-memory"></i> ${inst.ram_recomendada}</span>
                                    </div>
                                </div>

                                <div class="instance-actions">
                                    <button type="button" class="btn-install-instance" data-inst-id="${inst.id}">
                                        <i class="fas fa-download"></i> Preparar Pack
                                    </button>
                                    <button type="button" class="btn-copy-srv-ip" data-ip="${inst.ip}" title="Copiar IP: ${inst.ip}">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                </div>
                            </article>
                        `).join("")}
                    </div>
                `}
            `;

            container.querySelectorAll(".btn-copy-srv-ip").forEach(btn => {
                btn.addEventListener("click", async () => {
                    try {
                        await navigator.clipboard.writeText(btn.dataset.ip);
                        showToast("IP Copiada", `Dirección ${btn.dataset.ip} lista para pegar en Minecraft.`, "success");
                    } catch (_) {}
                });
            });

            container.querySelectorAll(".btn-install-instance").forEach(btn => {
                btn.addEventListener("click", () => {
                    const inst = instancesList.find(i => i.id === btn.dataset.instId);
                    if (inst) launchInstanceInstaller(inst);
                });
            });
        }

        function launchInstanceInstaller(inst) {
            const backdrop = document.getElementById("install-modal-backdrop");
            const title = document.getElementById("modal-inst-title");
            const desc = document.getElementById("modal-inst-desc");
            const fill = document.getElementById("modal-progress-fill");
            const stepText = document.getElementById("modal-step-text");

            title.textContent = inst.nombre;
            desc.textContent = `Paquete: ${inst.archivo_zip} (${inst.version})`;
            fill.style.width = "0%";
            backdrop.classList.add("open");

            const steps = [
                { pct: 25, text: `[1/4] Verificando whitelist para ${currentUser.username}...` },
                { pct: 55, text: `[2/4] Validando firmas SHA-256 de ${inst.mods_count} módulos...` },
                { pct: 85, text: `[3/4] Empaquetando recursos zyrisland: y configuraciones...` },
                { pct: 100, text: `[4/4] ¡Listo! Redirigiendo al paquete oficial...` }
            ];

            let idx = 0;
            stepText.textContent = steps[0].text;
            fill.style.width = `${steps[0].pct}%`;

            const timer = setInterval(() => {
                idx++;
                if (idx < steps.length) {
                    fill.style.width = `${steps[idx].pct}%`;
                    stepText.textContent = steps[idx].text;
                } else {
                    clearInterval(timer);
                    showToast("Paquete Verificado", `${inst.archivo_zip} preparado correctamente.`, "success");
                    if (inst.url_descarga) {
                        window.open(inst.url_descarga, "_blank", "noopener");
                    }
                }
            }, 650);

            document.getElementById("modal-close-btn").onclick = () => {
                clearInterval(timer);
                backdrop.classList.remove("open");
            };
        }

        /* =========================================================
           TAB B: HISTORIAL DE ADVERTENCIAS (WARNS)
           ========================================================= */
        function renderWarningsTab(container, user) {
            const warns = Array.isArray(user.warns) ? user.warns : [];
            const maxWarns = user.max_warns || 3;

            container.innerHTML = `
                <div class="section-header-row">
                    <h2><i class="fas fa-exclamation-triangle"></i> Registro de Advertencias (${warns.length})</h2>
                    <a href="https://zyrisland.net/soporte/terminos#seccion-7" target="_blank" rel="noopener" class="meta-chip" style="text-decoration: none;">
                        <i class="fas fa-book"></i> Consultar Art. 7.3 Reglamento
                    </a>
                </div>

                ${warns.length === 0 ? `
                    <div class="clean-record-box">
                        <i class="fas fa-check-circle"></i>
                        <h3>¡Expediente Impecable!</h3>
                        <p>No tienes ninguna advertencia registrada en tu cuenta de ZyrIsland. Mantén el juego limpio para conservar todos tus privilegios.</p>
                    </div>
                ` : `
                    <div class="warns-container">
                        ${warns.map(w => `
                            <article class="warn-card ${w.severidad || "leve"}">
                                <div class="warn-info">
                                    <h4>
                                        <span>${w.id || "WRN-2026"}</span>
                                        <span class="severity-tag">Severidad ${w.severidad || "Leve"}</span>
                                    </h4>
                                    <p>${w.razon}</p>
                                    <div class="warn-meta">
                                        Emitida por <strong>${w.staff || "Staff"}</strong> • Fecha: <strong>${w.fecha || "N/A"}</strong>
                                    </div>
                                </div>
                                <a href="https://discord.gg/DVBdqXgsGu" target="_blank" rel="noopener" class="btn-ban-logout" style="padding: 10px 16px; font-size: 0.76rem; text-decoration: none;">
                                    <i class="fab fa-discord"></i> Consultar
                                </a>
                            </article>
                        `).join("")}
                    </div>
                `}
            `;
        }

        /* =========================================================
           TAB C: PANEL STAFF (GESTIÓN DE WARNS, TEMP-BAN Y PERM-BAN)
           ========================================================= */
        function renderStaffModerationTab(container, adminUser) {
            const allUsers = getMergedAccounts();

            container.innerHTML = `
                <div class="section-header-row">
                    <h2><i class="fas fa-gavel"></i> Centro Disciplinario Staff</h2>
                    <button type="button" id="reset-sandbox-btn" class="meta-chip" style="cursor: pointer;">
                        <i class="fas fa-undo"></i> Restaurar JSON Original
                    </button>
                </div>

                <div class="staff-panel-grid">
                    <div class="staff-box">
                        <h3><i class="fas fa-user-shield"></i> Aplicar Sanción o Advertencia</h3>
                        <div class="staff-form-grid">
                            <div>
                                <label style="font-size: 0.72rem; font-weight: 800; color: #aaa; display: block; margin-bottom: 6px;">USUARIO OBJETIVO</label>
                                <select id="staff-target-user" class="staff-select">
                                    ${allUsers.map(u => `<option value="${u.username}">${u.username} (${u.baneo?.activo ? "BANEADO" : `${(u.warns || []).length} warns`})</option>`).join("")}
                                </select>
                            </div>

                            <div>
                                <label style="font-size: 0.72rem; font-weight: 800; color: #aaa; display: block; margin-bottom: 6px;">SEVERIDAD / DURACIÓN (TEMP-BAN EN HORAS)</label>
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                    <select id="staff-severity" class="staff-select">
                                        <option value="leve">Warn Leve</option>
                                        <option value="media" selected>Warn Media</option>
                                        <option value="grave">Warn Grave</option>
                                    </select>
                                    <input type="number" id="staff-ban-hours" class="staff-input" value="48" min="1" max="8760" placeholder="Horas Temp-Ban">
                                </div>
                            </div>

                            <div>
                                <label style="font-size: 0.72rem; font-weight: 800; color: #aaa; display: block; margin-bottom: 6px;">MOTIVO Y ARTÍCULO INFRINGIDO</label>
                                <textarea id="staff-reason" class="staff-textarea" rows="3" placeholder="Ej. Uso de cliente modificado o robo en propiedad privada (Art. 6.2.2)."></textarea>
                            </div>

                            <div class="staff-btn-row">
                                <button type="button" id="act-add-warn" class="btn-staff-action btn-warn">
                                    <i class="fas fa-exclamation-triangle"></i> Añadir Warn
                                </button>
                                <button type="button" id="act-tempban" class="btn-staff-action btn-tempban">
                                    <i class="fas fa-hourglass-half"></i> Temp-Ban
                                </button>
                                <button type="button" id="act-permban" class="btn-staff-action btn-permban">
                                    <i class="fas fa-ban"></i> Perm-Ban
                                </button>
                                <button type="button" id="act-pardon" class="btn-staff-action btn-pardon">
                                    <i class="fas fa-check-circle"></i> Limpiar / Perdonar
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="staff-box" style="border-top-color: #3b82f6;">
                        <h3><i class="fas fa-code"></i> Exportar accounts.json Actualizado</h3>
                        <p style="font-size: 0.82rem; color: var(--text-muted); margin: 0 0 12px 0;">
                            Los cambios aplicados arriba se prueban al instante en tu navegador. Copia este JSON y pégalo en tu repositorio de GitHub para hacerlo global:
                        </p>
                        <div class="json-export-area" id="json-export-box"></div>
                        <button type="button" id="copy-json-btn" class="btn-install-instance" style="width: 100%;">
                            <i class="fas fa-copy"></i> Copiar JSON Completo para GitHub
                        </button>
                    </div>
                </div>
            `;

            const exportBox = document.getElementById("json-export-box");
            exportBox.textContent = JSON.stringify(getMergedAccounts(), null, 2);

            const applyAction = (mode) => {
                const targetName = document.getElementById("staff-target-user").value;
                const severity = document.getElementById("staff-severity").value;
                const hours = Math.max(1, Number(document.getElementById("staff-ban-hours").value || 24));
                const reason = document.getElementById("staff-reason").value.trim() || "Sanción aplicada por incumplimiento de normativa ZyrIsland.";

                const list = getMergedAccounts();
                const target = JSON.parse(JSON.stringify(list.find(u => u.username === targetName)));
                if (!target) return;

                const nowStr = new Date().toISOString().slice(0, 16).replace("T", " ");

                if (mode === "warn") {
                    target.warns = target.warns || [];
                    target.warns.push({
                        id: `WRN-2026-${Math.floor(100 + Math.random() * 899)}`,
                        razon: reason,
                        severidad: severity,
                        fecha: nowStr,
                        staff: adminUser.username,
                        activa: true
                    });

                    // Auto-escalado si alcanza max_warns
                    const maxW = target.max_warns || 3;
                    if (target.warns.length >= maxW) {
                        target.baneo = {
                            activo: true,
                            tipo: "tempban",
                            id_caso: `BAN-2026-${Math.floor(100 + Math.random() * 899)}`,
                            razon: `Acumulación automática de ${target.warns.length}/${maxW} advertencias. Última: ${reason}`,
                            staff: adminUser.username,
                            fecha: nowStr,
                            expira: new Date(Date.now() + hours * 3600000).toISOString(),
                            apelable: true
                        };
                        showToast("Auto-TempBan Activado", `${target.username} alcanzó ${maxW} warns y fue suspendido.`, "error");
                    } else {
                        showToast("Advertencia Registrada", `Se añadió un warn (${target.warns.length}/${maxW}) a ${target.username}.`, "warn");
                    }
                } else if (mode === "tempban") {
                    target.baneo = {
                        activo: true,
                        tipo: "tempban",
                        id_caso: `BAN-2026-${Math.floor(100 + Math.random() * 899)}`,
                        razon: reason,
                        staff: adminUser.username,
                        fecha: nowStr,
                        expira: new Date(Date.now() + hours * 3600000).toISOString(),
                        apelable: true
                    };
                    showToast("Temp-Ban Aplicado", `${target.username} suspendido por ${hours}h.`, "error");
                } else if (mode === "permban") {
                    target.baneo = {
                        activo: true,
                        tipo: "permban",
                        id_caso: `BAN-2026-${Math.floor(100 + Math.random() * 899)}`,
                        razon: reason,
                        staff: adminUser.username,
                        fecha: nowStr,
                        expira: null,
                        apelable: false
                    };
                    showToast("Perm-Ban Aplicado", `${target.username} vetado permanentemente.`, "error");
                } else if (mode === "pardon") {
                    target.warns = [];
                    target.autorizado = true;
                    target.baneo = {
                        activo: false,
                        tipo: null,
                        id_caso: null,
                        razon: "",
                        staff: "",
                        fecha: "",
                        expira: null,
                        apelable: false
                    };
                    showToast("Historial Limpiado", `Se retiraron todas las sanciones de ${target.username}.`, "success");
                }

                saveAccountOverride(target);
                if (target.username === currentUser.username) {
                    currentUser = target;
                }
                lastRenderHash = "";
                renderAuthenticatedExperience();
            };

            document.getElementById("act-add-warn").addEventListener("click", () => applyAction("warn"));
            document.getElementById("act-tempban").addEventListener("click", () => applyAction("tempban"));
            document.getElementById("act-permban").addEventListener("click", () => applyAction("permban"));
            document.getElementById("act-pardon").addEventListener("click", () => applyAction("pardon"));

            document.getElementById("reset-sandbox-btn").addEventListener("click", () => {
                resetSandboxOverrides();
                lastRenderHash = "";
                showToast("JSON Restaurado", "Se restablecieron los valores originales del archivo accounts.json.", "success");
                fetchEcosystemData();
            });

            document.getElementById("copy-json-btn").addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(JSON.stringify(getMergedAccounts(), null, 2));
                    showToast("JSON Copiado", "Pega el contenido en accounts.json dentro de tu repositorio.", "success");
                } catch (_) {}
            });
        }

        // Inicialización y sondeo cada 4 segundos
        fetchEcosystemData();
        setInterval(fetchEcosystemData, 4000);
    </script>
</body>
</html>
