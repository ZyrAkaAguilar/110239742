<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyrIsland</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ERROR" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="background-graphic"></div>
    
    <div class="login-container">
        <h1>PLEASE <span class="highlight">LOG-IN</span></h1>
        <h2>WITH YOUR ACCOUNT</h2>

        <div id="initial-view" class="view-section">
            <button id="show-login-btn" class="red-btn">
                <span class="icon">⊞</span> Iniciar Sesión
            </button>
        </div>

        <div id="form-view" class="view-section hidden-smooth">
            <input type="text" id="username-input" placeholder="Nombre de usuario" autocomplete="off">
            <input type="password" id="password-input" placeholder="Contraseña">
            <button id="submit-login-btn" class="red-btn btn-small">Acceder</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
